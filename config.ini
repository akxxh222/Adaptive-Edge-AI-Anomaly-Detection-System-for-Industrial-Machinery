[Default]

; -------------------------------------------------------
; OPERATION
; -------------------------------------------------------

; Default mode if not overridden by --train flag
mode = monitor

; Training duration in seconds (900 = 15 minutes)
train_duration = 900

; -------------------------------------------------------
; GPIO PINS
; -------------------------------------------------------

; Status LED pin (BCM numbering)
led_pin = 17

; Shutdown button pin — GPIO27 (do NOT use GPIO3, it is the I2C SCL clock line)
shutdown_pin = 27

; -------------------------------------------------------
; I2C / ACCELEROMETER
; -------------------------------------------------------

; I2C bus number (1 on all modern Pi models)
i2c_bus = 1

; ADXL345 I2C address (0x53 when SDO is pulled LOW)
acc_addr = 0x53

; -------------------------------------------------------
; SAMPLING
; -------------------------------------------------------

; Accelerometer sample rate in Hz
sample_rate = 100

; ADXL345 output data rate in Hz (must match sample_rate)
; Supported: 25, 50, 100, 200, 400, 800
odata_rate = 100

; -------------------------------------------------------
; SIGNAL PROCESSING
; -------------------------------------------------------

; Rolling window size for RMS computation
window_size = 100

; FFT window size in samples (must be power of 2)
fft_size = 128

; High-pass filter cutoff frequency in Hz (removes DC gravity offset)
cutoff_hz = 0.5

; Bandpass filter range in Hz (low, high)
bandpass = 0.5, 45

; -------------------------------------------------------
; ANOMALY THRESHOLDS
; -------------------------------------------------------

; RMS below this value = machine is idle / off
idle_threshold = 0.08

; Combined Z-score above this = ANOMALY state (LED solid on)
fault_threshold = 6.0

; Combined Z-score above this = WARNING state (LED blinks)
alarm_threshold = 3.0

; -------------------------------------------------------
; EMA (EXPONENTIAL MOVING AVERAGE)
; -------------------------------------------------------

; Smoothing factor for adaptive baseline update during NORMAL state
; 0.90 = slow drift correction (recommended)
; Higher = slower adaptation, Lower = faster adaptation
alpha = 0.90

; -------------------------------------------------------
; CALIBRATION
; -------------------------------------------------------

; Number of samples to average for accelerometer offset calibration on boot
calibrate_samples = 100

; -------------------------------------------------------
; TEMPERATURE CORRECTION
; -------------------------------------------------------

; Additive offset applied to raw DS18B20 reading (degrees C)
temp_offset = 0.0

; Multiplicative scale applied after offset
temp_scale = 1.0

; -------------------------------------------------------
; FILES
; -------------------------------------------------------

log_file = monitor.log
train_file = train.csv
monitor_file = monitor.csv
model_file = model.json

; -------------------------------------------------------
; LOGGING
; -------------------------------------------------------

; Maximum log file size in bytes before rotation (1MB)
logging_size = 1000000
